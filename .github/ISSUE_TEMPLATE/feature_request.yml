name: Feature request
description: Suggest an idea or enhancement for ProcureFlow OSS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and the roadmap before proposing work. Explain the problem using non-confidential examples.
        A proposal is a discussion, not a delivery commitment.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific procurement pain point?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
